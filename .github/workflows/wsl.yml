name: WSL2 native validation
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  wsl2:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable Ubuntu distribution
        shell: pwsh
        run: |
          wsl --status
          wsl --install --distribution Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { throw 'WSL distribution installation failed' }
          wsl --list --verbose
      - name: Validate inside WSL2
        shell: pwsh
        run: |
          $script = (wsl -d Ubuntu-24.04 -u root -- wslpath "$env:GITHUB_WORKSPACE/scripts/wsl-smoke.sh").Trim()
          wsl -d Ubuntu-24.04 -u root -- bash $script "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'WSL2 validation failed' }
      - name: Stop disposable distribution
        if: always()
        run: wsl --terminate Ubuntu-24.04
