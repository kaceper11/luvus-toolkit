name: WSL2 native validation
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  wsl2:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable Ubuntu distribution
        timeout-minutes: 5
        shell: pwsh
        run: |
          wsl --status
          wsl --install --web-download --distribution Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { throw 'WSL distribution installation failed' }
          wsl --list --verbose
      - name: Validate inside WSL2
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE/scripts/wsl-smoke.sh".Replace('\', '/')
          $script = (wsl -d Ubuntu-24.04 -u root --exec wslpath $source).Trim()
          wsl -d Ubuntu-24.04 -u root --exec bash $script "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'WSL2 validation failed' }
      - name: Stop disposable distribution
        if: always()
        run: wsl --terminate Ubuntu-24.04
