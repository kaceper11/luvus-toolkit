name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python toolkit.py bootstrap
      - run: python toolkit.py test
      - run: npm test
        if: success() || failure()
      - run: node scripts/power-smoke.mjs
        if: (success() || failure()) && runner.os != 'Linux'
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned native Luvus and verify archive
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/RizRiyz/luvus/releases/download/v0.13.4/luvus-v0.13.4-x86_64-pc-windows-msvc.zip -OutFile "$env:RUNNER_TEMP/luvus.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/luvus.zip" -Algorithm SHA256).Hash -ne 'A64F4B7460D476B5BAC56CB7C13ECDFA2492036F33872325A70E185AEE3B93DD') { throw 'Luvus archive hash mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/luvus.zip" "$env:RUNNER_TEMP/luvus"
          $luvusBinary = (Get-ChildItem "$env:RUNNER_TEMP/luvus" -Filter luvus.exe -Recurse | Select-Object -First 1).FullName
          "LUVUS_BIN_PATH=$luvusBinary" >> $env:GITHUB_ENV
      - name: Fresh installation and native panes
        run: python -X utf8 scripts/smoke.py --install
