# Generated by toolkit.py manifest; edit feature manifests, then regenerate.
id = "kacper.toolkit"
name = "Luvus Toolkit"
version = "0.1.0"
min_luvus_version = "0.13.4"
description = "Tasks, Git, agent launching, commands, usage and Keep Awake"
platforms = ["macos", "linux", "windows"]

[[build]]
platforms = ["macos", "linux"]
command = ["python3", "toolkit.py", "bootstrap"]

[[actions]]
id = "doctor"
title = "Check Toolkit installation"
platforms = ["macos", "linux"]
command = ["python3", "toolkit.py", "doctor"]

[[build]]
platforms = ["windows"]
