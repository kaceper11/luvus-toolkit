id = "kacper.keep-awake"
name = "Keep Awake"
version = "0.1.0"
min_luvus_version = "0.13.4"
description = "Prevent idle sleep while agents work, with a 20% battery cutoff"
platforms = ["macos"]

[[startup]]
command = ["node", "cli.mjs", "start"]

[[bars]]
id = "awake"
title = "Keep Awake"
region = "bottom-right"
priority = 50

[[actions]]
id = "cycle"
title = "Keep Awake: Auto / On / Off"
command = ["node", "cli.mjs", "cycle"]
