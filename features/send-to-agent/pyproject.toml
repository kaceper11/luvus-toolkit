[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luvus-send-to-agent"
version = "0.2.0"
description = "Send quoted responses and code context to a Luvus agent"
requires-python = ">=3.11"
dependencies = ["textual==8.2.8"]

[tool.setuptools]
py-modules = ["send_agent", "composer", "checkout_state", "tab_titles"]
